<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#175b49">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="日迹">
<title>日迹 Daylog · 今日总览</title>
<script>document.documentElement.classList.add("daylog-auth-checking")</script>
<style>html{background:#f6f8f5}html.daylog-auth-checking{background:#edf4ee}</style>
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="preload" href="forest.webp" as="image"><link rel="preload" href="lxgwwenkai-common.woff2" as="font" type="font/woff2" crossorigin><link rel="prefetch" href="article.html"><link rel="prefetch" href="article.css"><link rel="prefetch" href="article.js"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="extras.css"><link rel="stylesheet" href="auth.css?v=1"></head>
<body>
<button id="veil" aria-label="关闭导航" hidden></button>
<aside id="sidebar"><div class="brand"><span class="brand-icon" data-i="journal"></span><b>日迹</b><span class="brand-en">Daylog</span></div>
<nav><div class="nav-label">工作空间</div><div id="main-nav"></div><div class="nav-label group-label">记录分类</div><div id="category-nav"></div></nav>
<div id="side-foot"><div id="calendar"></div><button id="profile" class="profile"><span class="avatar" data-i="user"></span><span><b>我的手记本</b><small><i></i> 本地存储</small></span><span class="profile-settings" data-i="settings"></span></button></div></aside>
<div class="shell"><header class="topbar"><button id="menu" class="icon-btn" aria-label="打开导航" data-i="menu"></button><div class="crumb"><span data-i="panels"></span><span>我的工作台</span><i>/</i><strong id="crumb">今日总览</strong></div><button class="search-launch" id="search-open"><span data-i="search"></span><span>搜索记录...</span><kbd>Ctrl K</kbd></button></header>
<main><div id="dashboard">
<section class="hero"><div class="hero-copy"><div class="hero-date" id="hero-date"></div><h1>今日手记</h1><p id="day-quote"></p></div></section>
<section class="market-section"><div class="section-heading"><h2><span data-i="activity"></span>市场速览</h2><button class="market-status" id="refresh" title="刷新行情"><span id="market-state">最近行情</span><span data-i="refresh"></span></button></div><div class="markets" id="markets"></div></section>
<div class="workgrid"><div class="write-column"><section class="card editor-card"><div class="card-head"><h2><span class="heading-icon" data-i="pen"></span>轻度记录</h2><a id="open-deep" class="deep-link" href="article.html#new/note" aria-label="在当前页进入全屏深度记录"><span data-i="journal"></span>深度记录</a></div>
<div class="editor-body"><div id="editor-tabs" role="group" aria-label="记录类型"></div><div class="record-context-row"><button type="button" id="locate-weather" class="context-button" data-state="idle" title="获取当前定位和天气" aria-label="获取当前定位和天气"></button><div id="entry-moods" class="inline-mood-group" role="group" aria-label="这条记录的心情"></div><div class="media-tool-group"><button type="button" id="pick-photo" title="从相册添加图片" aria-label="从相册添加图片"><span data-i="image"></span><span>图片</span></button><button type="button" id="take-photo" title="拍照记录" aria-label="拍照记录"><span data-i="camera"></span><span>拍照</span></button></div><details class="style-details"><summary><span>Aa</span>排版</summary><div class="style-panel"><section><h3>字体</h3><div class="font-options"><button type="button" data-editor-font="wenkai">文楷</button><button type="button" data-editor-font="song">宋体</button><button type="button" data-editor-font="kai">楷体</button><button type="button" data-editor-font="sans">黑体</button></div></section><section class="range-options"><label>字号<input type="range" min="16" max="26" step=".5" data-style-range="fontSize"><output data-style-output="fontSize"></output></label><label>行距<input type="range" min="1.6" max="2.6" step=".05" data-style-range="lineHeight"><output data-style-output="lineHeight"></output></label><label>字距<input type="range" min="0" max=".08" step=".005" data-style-range="letterSpacing"><output data-style-output="letterSpacing"></output></label><label>段距<input type="range" min=".4" max="1.7" step=".1" data-style-range="paragraphGap"><output data-style-output="paragraphGap"></output></label></section><section><h3>纸张</h3><div class="paper-options"><button type="button" data-editor-bg="paper">纸白</button><button type="button" data-editor-bg="mist">晨雾</button><button type="button" data-editor-bg="grid">方格</button><button type="button" data-editor-bg="forest">林间</button><button type="button" id="background-picker-button">背景图</button></div></section></div></details></div><div id="editor-surface" class="writing-area"><div id="editor" role="textbox" aria-label="记录正文" contenteditable="true" aria-multiline="true" data-placeholder="此刻，在想些什么？" spellcheck="false"></div></div><div class="editor-tools"><div class="tool-group"><button data-format="bold" aria-label="加粗" title="加粗 (Ctrl+B)"><b>B</b></button><button data-format="italic" aria-label="斜体" title="斜体"><em>I</em></button><button data-format="underline" aria-label="下划线" title="下划线"><u>U</u></button><button data-format="strikeThrough" aria-label="删除线" title="删除线"><s>S</s></button><button data-format="insertUnorderedList" aria-label="项目列表" title="项目列表" data-i="list"></button><button data-format="quote" aria-label="引用" title="引用" data-i="quote"></button></div><button id="smart" class="smart" aria-pressed="true"><span data-i="sparkles"></span>智能排版</button><span id="word-count">0 字</span></div><input type="file" id="photo-picker" accept="image/*" multiple hidden><input type="file" id="camera-picker" accept="image/*" capture="environment" hidden><input type="file" id="background-picker" accept="image/*" hidden></div>
<div class="editor-foot"><span id="draft-state"><span data-i="shield"></span> 本机草稿</span><button id="save" class="primary"><span data-i="plus"></span>保存记录</button></div><div id="article-drafts" hidden></div></section>
<section class="timeline-section"><div class="section-heading"><h2><span data-i="history"></span>今日时间线 <small id="today-count"></small></h2><button class="text-btn" id="all-entries">查看全部 <span data-i="chevronR"></span></button></div><div id="today-list"></div></section></div>
<div class="utility-column"><section class="card quick-card"><div class="card-head"><h2><span class="heading-icon warm" data-i="zap"></span>一键速记</h2></div><div id="quick-actions"></div></section>
<section class="card mood-card"><div class="card-head"><h2><span class="heading-icon pink" data-i="smile"></span>此刻心情</h2></div><div id="moods"></div></section></div></div></div>
<section id="archive" hidden></section><section id="stats" hidden></section></main></div>
<nav id="mobile-nav" aria-label="移动端导航"><button type="button" data-view="home"><span data-i="grid"></span><small>今日</small></button><button type="button" data-view="history"><span data-i="history"></span><small>时间线</small></button><button type="button" data-view="stats"><span data-i="chart"></span><small>统计</small></button><button type="button" id="mobile-profile"><span data-i="user"></span><small>我的</small></button></nav>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" id="dialog-close" aria-label="关闭" data-i="x"></button></div><div id="dialog-content"></div></dialog><div id="toast" role="status"></div>
<script type="module" src="boot.js"></script></body></html>
